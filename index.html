<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог майна — Чернігів</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">КАТАЛОГ МАЙНА</div>
      <h1>Продаж майна та обладнання</h1>
      <p>Дані завантажені з Excel · 252 позиції</p>
    </div>
    <div class="top-actions">
      <a class="btn light" href="data/catalog.xlsx" download>↓ Excel</a>
      <button id="openAdminBtn" class="btn primary">+ Додати позицію</button>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="Пошук за назвою, інв. № або локацією…" />
      <select id="categoryFilter">
        <option value="all">Усі категорії</option>
      </select>
      <select id="statusFilter">
        <option value="all">Усі статуси</option>
      </select>
      <button id="resetDemoBtn" class="btn ghost">Відновити дані Excel</button>
    </section>

    <section id="stats" class="stats"></section>
    <section id="catalog" class="catalog"></section>
    <div id="emptyState" class="empty hidden">Нічого не знайдено.</div>
  </main>

  <dialog id="adminDialog" class="dialog">
    <form id="productForm" method="dialog" class="form-card">
      <div class="dialog-head">
        <div>
          <div class="eyebrow">АДМІНКА</div>
          <h2>Додати позицію</h2>
        </div>
        <button type="button" id="closeAdminBtn" class="icon-btn">✕</button>
      </div>

      <div class="grid2">
        <label>Назва
          <input id="name" required placeholder="Напр. Морозильна скриня" />
        </label>
        <label>Категорія
          <input id="category" required placeholder="Холодильне обладнання" />
        </label>
        <label>Ціна, грн
          <input id="price" type="number" min="0" step="1" placeholder="8500" />
        </label>
        <label>Локація
          <input id="location" placeholder="Чернігів" />
        </label>
        <label>Стан
          <select id="condition">
            <option>Б/У</option>
            <option>Нове</option>
            <option>Потребує ремонту</option>
          </select>
        </label>
        <label>Статус
          <input id="status" value="Не подано" />
        </label>
      </div>

      <label>Опис
        <textarea id="description" rows="4" placeholder="Короткий опис, розміри, характеристики…"></textarea>
      </label>

      <label>Фото
        <input id="photos" type="file" accept="image/*" multiple />
        <small>Фото, додані через форму, зберігаються локально у браузері цього пристрою.</small>
      </label>
      <div id="photoPreview" class="photo-preview"></div>

      <div class="form-actions">
        <button type="button" id="cancelBtn" class="btn ghost">Скасувати</button>
        <button type="submit" class="btn primary">Зберегти</button>
      </div>
    </form>
  </dialog>

  <dialog id="detailDialog" class="dialog detail-dialog">
    <div id="detailContent"></div>
  </dialog>

  <script src="catalog-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
